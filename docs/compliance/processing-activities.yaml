# Verarbeitungstätigkeiten (Art. 30 DSGVO) – Eingabe für den ComplianceReportGenerator
# (mvn -Prelease verify). Von Hand gepflegt; Grundlage: ACCOUNT_PROZESS_BESCHREIBUNG.md.
# Rechtsgrundlagen sind Vorschläge und durch den DSB zu bestätigen.

activities:
  - name: Ausgabe und Aktivierung von Benutzerkonten und Chipkarten
    purpose: Ausgabe/Aktivierung von Konten und Chipkarten durch Sachbearbeitende (Publisher)
    legalBasis: Art. 6 Abs. 1 lit. b / e DSGVO
    dataSubjects: [Antragstellende, Sachbearbeitende]
    dataCategories: [Name, Benutzername, Mail, Kundennummer/Barcode, Chipkarten-Status]
    recipients: [LDAP-Verzeichnis (Aktivitätsprotokoll soniaUserLog)]
    transfer: keiner
    retention: LDAP-Bestand nach den Regeln des Verzeichnisdienstes
    measures: [OIDC-Login mit PKCE, Rolle PUBLISHER, LDAP-Filterwerte per Whitelist bereinigt]

  - name: Erfassung handschriftlicher Unterschriften (Signature-Pad)
    purpose: Nachweis der Kenntnisnahme/Zustimmung durch die antragstellende Person
    legalBasis: Art. 6 Abs. 1 lit. b/c DSGVO; ggf. Art. 9 Abs. 2 (biometrisch)
    dataSubjects: [Antragstellende]
    dataCategories: [Unterschrift (PNG/SVG im signierten JWT), Name, Mail, Ausweis-Scan, Lichtbild]
    recipients: [PostgreSQL (feldverschlüsselt), Dateisystem (AES-256-GCM)]
    transfer: keiner
    retention: P90D nach letztem Kontakt im Verzeichnis (automatische Löschung)
    measures: [Pad-Authentisierung per eigenem Schlüsselpaar (JWT), immutable-Flag, Feld- und Dateiverschlüsselung]

  - name: Übernahme von Online-Identifizierungsergebnissen (eID-Dienst MIRA)
    purpose: Aufbewahrung des Identifizierungsergebnisses als Nachweis
    legalBasis: Art. 6 Abs. 1 lit. c DSGVO; Art. 9 Abs. 2 DSGVO (Erlaubnistatbestand zu dokumentieren, R-09)
    dataSubjects: [Antragstellende]
    dataCategories: [Ausweisdaten inkl. MRZ und Dokumentnummer, Geburtsdatum, Adresse, Lichtbild, Video/Audio, PDF]
    recipients: [PostgreSQL (feldverschlüsselt), Dateisystem (AES-256-GCM)]
    transfer: keiner durch die Anwendung (Hosting/eID-Dienst organisatorisch zu dokumentieren)
    retention: P90D nach letztem Kontakt im Verzeichnis (automatische Löschung)
    measures: [Bearer-Token + HMAC-SHA256 + Frischefenster + Replay-Schutz, Feld- und Dateiverschlüsselung]

  - name: Einsichtnahme und Audit durch Administratoren
    purpose: Prüfung der Nachweise, Auskunft und Löschung auf Anfrage
    legalBasis: Art. 6 Abs. 1 lit. c/f DSGVO
    dataSubjects: [Antragstellende, Administratoren]
    dataCategories: [alle oben genannten Nachweise (entschlüsselt angezeigt)]
    recipients: [Rollen ADMIN und AUDITADMIN bei entsiegeltem Vault, Graylog (Audit-Trail)]
    transfer: keiner
    retention: Audit-Einträge nach Log-Retention
    measures: [Vault-Entsiegelung per YubiKey (WebAuthn/PRF) mit TTL, Lese-Audit-Trail AUDIT_READ, Zugriff nur ADMIN und AUDITADMIN]

  - name: Verzeichnisabgleich und Löschkonzept
    purpose: Speicherbegrenzung – Löschung aller Nachweise nach Ablauf der Karenzzeit
    legalBasis: Art. 6 Abs. 1 lit. c/f DSGVO; Art. 5 Abs. 1 lit. e DSGVO
    dataSubjects: [Antragstellende]
    dataCategories: [Benutzername, Vorname, Nachname, Mail, Zeitpunkt des letzten Kontakts]
    recipients: [LDAP-Verzeichnis (lesend)]
    transfer: keiner
    retention: Eintrag wird mit den Nachweisen der Person gelöscht
    measures: [DbDeletionScheduler (täglich), idempotente Löschung Datei vor Datenbankzeile, Audit USER_DELETED]

# Beschreibung je SdbSecretType. Neue Enum-Werte ohne Eintrag erscheinen im
# Dokument als "nicht beschrieben" und müssen hier ergänzt werden.
dataTypes:
  SIGNATURE_PAD_JSON:
    content: Konfiguration eines Signature-Pads (öffentlicher Schlüssel, Client-Umgebung)
    storage: secretdata.secret (feldverschlüsselt)
    specialCategory: false
  ID_SIGNATURE_JWT:
    content: Signiertes JWT mit Unterschrift (PNG/SVG), Name, Mail
    storage: secretdata.secret (feldverschlüsselt)
    specialCategory: true
  ID_FRONT_IMAGE:
    content: Ausweis-Scan Vorderseite
    storage: Datei (AES-256-GCM)
    specialCategory: true
  ID_BACK_IMAGE:
    content: Ausweis-Scan Rückseite
    storage: Datei (AES-256-GCM)
    specialCategory: true
  EXT_IDENTIFICATION_STATUS:
    content: Identifizierungsstatus des eID-Dienstes (Ausweis-, Adress- und Kontaktdaten)
    storage: secretdata.secret (feldverschlüsselt)
    specialCategory: true
  EXT_IDENTIFICATION_ARCHIVE:
    content: ZIP mit Pass-Scans, Portrait, Audio, Video und PDF der Online-Identifizierung
    storage: Datei (AES-256-GCM)
    specialCategory: true
