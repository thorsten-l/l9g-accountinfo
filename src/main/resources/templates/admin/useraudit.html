<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>AccountInfo - Personen Audit</title>
    <div th:replace="~{header::head}"></div>
    <style>
      .photo-viewfinder {
        position: relative;
        width: 100%;
        max-width: 480px;
        margin: 1rem auto;
        aspect-ratio: 1.585 / 1;
        border: 2px dashed #6c757d;
        border-radius: 6px;
        overflow: hidden;
      }
      .photo-viewfinder img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #photo-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.8);
        z-index: 9999;
        justify-content: center;
        align-items: center;
      }
      .overlay-content {
        background: white;
        padding: 20px;
        border-radius: 8px;
        position: relative;
        width: 90%;
        max-width: 600px;
      }
    </style>
  </head>
  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div id="photo-overlay">
      <div class="overlay-content shadow-lg" style="max-height: 90vh; overflow-y: auto;">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 id="overlay-title" class="mb-0">Details</h4>
          <button type="button" class="btn-close" onclick="document.getElementById('photo-overlay').style.display='none'"></button>
        </div>
        
        <div id="overlay-info-container" class="mb-3" style="display:none;">
          <div class="card bg-light">
            <div class="card-body p-3">
              <div id="info-content"></div>
            </div>
          </div>
        </div>

        <div id="overlay-sig-container" class="mb-3" style="display:none;">
          <div class="card bg-light">
            <div class="card-body p-1 text-center">
              <img id="overlay-sig-img" src="" alt="Unterschrift" style="max-width: 100%; max-height: 250px; object-fit: contain;">
            </div>
          </div>
        </div>

        <div id="overlay-photo-container" class="photo-viewfinder" style="display:none;">
          <img id="overlay-img" src="" alt="Vorschau">
        </div>

        <div class="mt-3 text-end">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('photo-overlay').style.display='none'">Schließen</button>
        </div>
      </div>
    </div>
    <div class="app-wrapper">
      <div th:replace="~{header::header}"></div>
      <!--begin::App Main-->
      <main class="app-main">
        <div class="container mt-5">
          <div class="row justify-content-center">
            <div class="col-md-8">

              <!-- Search Card -->
              <div class="card shadow mb-4">
                <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
                  <h3 class="card-title mb-0">
                    <i class="fa-solid fa-users-viewfinder me-2"></i>
                    Personensuche
                  </h3>
                  <div th:if="${isUnsealed}" id="unlockTimer" class="badge bg-light text-danger p-2 fs-6 shadow-sm">
                    <i class="fa-solid fa-clock me-1"></i> <span id="timeLeft">--</span>s
                  </div>
                </div>
                <div class="card-body">
                  <div class="input-group input-group-lg">
                    <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" class="form-control" id="common-name-input" placeholder="Vorname Nachname" autocomplete="off">
                  </div>
                  <select id="common-name-results" class="form-control form-control-lg mt-2 d-none" size="10"></select>
                </div>
                <div class="card-footer d-flex justify-content-end bg-light">
                  <button type="button" class="btn btn-outline-secondary btn-lg me-2" id="btn-clear-common-name">
                    <i class="fa-solid fa-eraser me-1"></i> Löschen
                  </button>
                  <button type="button" class="btn btn-danger btn-lg" id="btn-send-common-name">
                    <i class="fa-solid fa-search me-1"></i> Suchen
                  </button>
                </div>
              </div>

              <!-- Results Card -->
              <div class="card shadow">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                  <h3 class="card-title mb-0">
                    <i class="fa-solid fa-list-check me-2"></i>
                    Audit Ergebnisse
                  </h3>
                  <div id="user-actions" class="d-none">
                    <button type="button" class="btn btn-outline-light btn-sm me-1"
                            id="btn-export-user" title="Metadaten exportieren (ZIP)">
                      <i class="fa-solid fa-file-export"></i>
                    </button>
                    <button type="button" class="btn btn-danger btn-sm"
                            id="btn-delete-user" title="Alle Nutzerdaten unwiderruflich löschen">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </div>
                </div>
                <div class="card-body p-0">
                  <div class="table-responsive">
                    <table class="table table-hover mb-0" id="audit-table">
                      <thead class="table-light">
                        <tr>
                          <th class="ps-4">Datum</th>
                          <th>Typ</th>
                          <th class="text-center pe-4">Aktion</th>
                        </tr>
                      </thead>
                      <tbody id="audit-results-body">
                        <tr>
                          <td colspan="3" class="text-center py-4 text-muted">
                            <i class="fa-solid fa-search me-2"></i>
                            Bitte suchen Sie nach einer Person.
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
                <div class="card-footer bg-light text-end py-3">
                  <a th:href="@{/admin}" class="btn btn-outline-secondary">
                    <i class="fa-solid fa-arrow-left me-2"></i> Zurück
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div th:replace="~{footer::footer}"></div>

    <script>
      const commonNameInput = document.getElementById('common-name-input');
      const commonNameResults = document.getElementById('common-name-results');
      const btnClearCommonName = document.getElementById('btn-clear-common-name');
      const btnSendCommonName = document.getElementById('btn-send-common-name');
      const auditResultsBody = document.getElementById('audit-results-body');
      const userActions = document.getElementById('user-actions');
      const btnExportUser = document.getElementById('btn-export-user');
      const btnDeleteUser = document.getElementById('btn-delete-user');

      const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
      const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

      let debounceTimer = null;
      let currentAbortController = null;
      let selectedPersonUid = null;
      let currentUserUid = null;
      let currentAuditEntries = [];

      function fetchPersons(query, signal)
      {
        return fetch(`/api/v1/admin/secret/search/person?query=${encodeURIComponent(query)}`, {
          method: 'GET',
          headers: {'Accept': 'application/json'},
          signal: signal
        }).then(response => {
          if (!response.ok)
          {
            if (response.status === 404)
             
              return [];
            throw new Error(`Server-Fehler: ${response.status}`);
          }
          return response.json();
        });
      }

      function fetchAuditData(uid)
      {
        return fetch(`/api/v1/admin/secret/audit/person/${encodeURIComponent(uid)}`, {
          method: 'GET',
          headers: {'Accept': 'application/json'}
        }).then(response => {
          if (!response.ok)
          {
            if (response.status === 404)
             
              return [];
            throw new Error(`Server-Fehler: ${response.status}`);
          }
          return response.json();
        });
      }

      function formatDate(timestamp)
      {
        if (!timestamp)
         
          return '-';
        const date = new Date(timestamp);
        const pad = (n) => n.toString().padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ` +
                `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
      }

      function updateAuditTable(entries)
      {
        currentAuditEntries = entries || [];
        // Export/Delete only make sense when the selected user actually has data.
        userActions.classList.toggle('d-none', !(entries && entries.length > 0));
        auditResultsBody.innerHTML = '';
        if (!entries || entries.length === 0)
        {
          auditResultsBody.innerHTML = `
            <tr>
              <td colspan="3" class="text-center py-4 text-muted">
                <i class="fa-solid fa-triangle-exclamation me-2"></i> Keine Einträge gefunden.
              </td>
            </tr>`;
          return;
        }

        entries.forEach(entry => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="ps-4">${formatDate(entry.modifyTimestamp)}</td>
            <td><code>${entry.type}</code></td>
            <td class="text-center pe-4">
              <button class="btn btn-outline-danger btn-sm border-0" onclick="showDetails('${entry.id}', '${entry.type}')">
                <i class="fa-solid fa-circle-info"></i>
              </button>
            </td>
          `;
          auditResultsBody.appendChild(row);
        });
      }

      function formatUserObj(obj) {
        if (!obj) return '-';
        if (typeof obj === 'string') {
           try {
             obj = JSON.parse(obj);
           } catch(e) { return obj; }
        }
        return `<strong>${obj.name || ''}</strong> (${obj.username || ''}) &lt;${obj.mail || ''}&gt;`;
      }

      function escapeHtml(value) {
        if (value === null || value === undefined) return '';
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatStatusDate(value) {
        if (!value) return null;
        const date = new Date(value);
        if (isNaN(date.getTime())) return value;
        return formatDate(date);
      }

      function yesNo(value) {
        if (value === true) return 'Ja';
        if (value === false) return 'Nein';
        return null;
      }

      // Builds a "label: value" row, skipping empty values.
      function statusRow(label, value) {
        if (value === null || value === undefined || value === '') return '';
        return `<div class="col-5 col-md-4 text-muted">${escapeHtml(label)}:</div>` +
               `<div class="col-7 col-md-8">${escapeHtml(value)}</div>`;
      }

      function statusSection(title, rowsHtml) {
        if (!rowsHtml) return '';
        return `<h6 class="text-danger mt-3 mb-2">${escapeHtml(title)}</h6>` +
               `<div class="row small g-1">${rowsHtml}</div>`;
      }

      // Human-readable byte size (B / KB / MB / GB).
      function formatBytes(bytes) {
        if (bytes === null || bytes === undefined || bytes === '') return null;
        let value = Number(bytes);
        if (isNaN(value)) return null;
        const units = ['B', 'KB', 'MB', 'GB'];
        let i = 0;
        while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }
        return `${i === 0 ? value : value.toFixed(1)} ${units[i]}`;
      }

      // Holds the currently opened archive ({id, data}) so the file list and
      // an inline PDF view can be toggled without refetching.
      let currentArchive = null;

      // Renders the EXT_IDENTIFICATION_ARCHIVE general data and ZIP file list.
      // PDF entries get an eye icon to display them inline (Chrome PDF viewer).
      function renderArchive(data) {
        const d = data.description || {};
        let html = statusSection('Allgemein',
          statusRow('Benutzername', d.username || data.name) +
          statusRow('Name', d.name) +
          statusRow('E-Mail', d.mail) +
          statusRow('PID', d.pid) +
          statusRow('Archivgröße', formatBytes(data.size)) +
          statusRow('Anzahl Dateien', (data.files || []).length));

        const files = data.files || [];
        if (files.length > 0) {
          let rows = '';
          files.forEach((f, idx) => {
            const isPdf = /\.pdf$/i.test(f.name || '');
            const action = isPdf
              ? `<button type="button" class="btn btn-outline-danger btn-sm border-0 py-0" title="Anzeigen" onclick="showArchivePdf(${idx})"><i class="fa-solid fa-eye"></i></button>`
              : '';
            rows += `<tr><td><code>${escapeHtml(f.name)}</code></td>` +
                    `<td class="text-end text-nowrap">${escapeHtml(formatBytes(f.size))}</td>` +
                    `<td class="text-center" style="width:1%">${action}</td></tr>`;
          });
          html += `<h6 class="text-danger mt-3 mb-2">Dateien</h6>` +
            `<div class="table-responsive"><table class="table table-sm table-striped small mb-0 align-middle">` +
            `<thead><tr><th>Dateiname</th><th class="text-end">Größe</th><th></th></tr></thead>` +
            `<tbody>${rows}</tbody></table></div>`;
        }
        return html;
      }

      // Re-renders the archive file list (used to leave the inline PDF view).
      function showArchiveList() {
        if (!currentArchive) return;
        document.getElementById('info-content').innerHTML = renderArchive(currentArchive.data);
      }

      // Displays a PDF archive entry inline using Chrome's embedded PDF viewer.
      // '#toolbar=0' hides the viewer toolbar (download/print) — best-effort,
      // the response is additionally served as inline/no-store on the server.
      function showArchivePdf(index) {
        if (!currentArchive) return;
        const file = currentArchive.data.files[index];
        const url = `/api/v1/admin/secret/archive/file?id=${encodeURIComponent(currentArchive.id)}`
          + `&name=${encodeURIComponent(file.name)}#toolbar=0&navpanes=0&scrollbar=0`;
        document.getElementById('info-content').innerHTML =
          `<div class="d-flex justify-content-between align-items-center mb-2">` +
            `<button type="button" class="btn btn-outline-secondary btn-sm" onclick="showArchiveList()">` +
              `<i class="fa-solid fa-arrow-left me-1"></i> Zurück zur Liste</button>` +
            `<span class="small text-muted text-truncate ms-2">${escapeHtml(file.name)}</span>` +
          `</div>` +
          `<iframe src="${url}" title="PDF" ` +
            `style="width:100%; height:70vh; border:1px solid #dee2e6; border-radius:4px;"></iframe>`;
      }

      // Renders the WebID IdentificationStatus JSON analog to the signature audit.
      function renderIdentificationStatus(status) {
        let html = '';

        const success = status.success === true;
        html += `<div class="mb-3">` +
          `<span class="badge ${success ? 'bg-success' : 'bg-danger'} fs-6">` +
          `<i class="fa-solid ${success ? 'fa-circle-check' : 'fa-circle-xmark'} me-1"></i>` +
          `${success ? 'Erfolgreich identifiziert' : 'Nicht identifiziert'}</span>`;
        if (status.rejectionReason) {
          html += `<div class="mt-2 text-danger small">` +
            `<i class="fa-solid fa-triangle-exclamation me-1"></i>` +
            `${escapeHtml(status.rejectionReason)}</div>`;
        }
        html += `</div>`;

        html += statusSection('Identifikation',
          statusRow('Transaktion', status.transactionId) +
          statusRow('Action-ID', status.actionId) +
          statusRow('Action-Typ', status.actionType) +
          statusRow('Antworttyp', status.responseType) +
          statusRow('Produkt', status.product ? status.product.name : null) +
          statusRow('Identifiziert am', formatStatusDate(status.identifiedOn)) +
          statusRow('Abgeschlossen am', formatStatusDate(status.finishedOn)) +
          statusRow('TrueID', yesNo(status.isTrueid)) +
          statusRow('Abweichung', yesNo(status.mismatch)));

        const u = status.user;
        if (u) {
          const addr = u.address || {};
          const contact = u.contact || {};
          const street = [addr.street, addr.streetNo].filter(Boolean).join(' ');
          const cityLine = [addr.zip, addr.city].filter(Boolean).join(' ');
          html += statusSection('Person',
            statusRow('Anrede', u.title) +
            statusRow('Geschlecht', u.sex) +
            statusRow('Vorname', u.firstname) +
            statusRow('Nachname', u.lastname) +
            statusRow('Geburtsdatum', u.dateOfBirth) +
            statusRow('Straße', street) +
            statusRow('Adresszusatz', addr.addressLine1) +
            statusRow('Adresszusatz 2', addr.addressLine2) +
            statusRow('PLZ / Ort', cityLine) +
            statusRow('Region', addr.region) +
            statusRow('Land', addr.country) +
            statusRow('E-Mail', contact.email) +
            statusRow('Mobil', contact.cell) +
            statusRow('Telefon', contact.phone));
        }

        const d = status.idDocument;
        if (d) {
          html += statusSection('Ausweisdokument',
            statusRow('Dokumenttyp', d.documentType) +
            statusRow('Behörde', d.authority) +
            statusRow('Ausgestellt am', d.dateOfIssue) +
            statusRow('Gültig bis', d.dateOfExpiry) +
            statusRow('Staatsangehörigkeit', d.nationality) +
            statusRow('Ausstellungsland', d.issuingCountry) +
            statusRow('Dokumentnummer', d.idNumber) +
            statusRow('Geburtsname', d.nameAtBirth) +
            statusRow('Geburtsort', d.placeOfBirth) +
            statusRow('MRZ', d.mrz));
        }

        return html;
      }

      function showDetails(id, type) {
        const infoContainer = document.getElementById('overlay-info-container');
        const photoContainer = document.getElementById('overlay-photo-container');
        const sigContainer = document.getElementById('overlay-sig-container');
        const infoContent = document.getElementById('info-content');
        const img = document.getElementById('overlay-img');
        const sigImg = document.getElementById('overlay-sig-img');
        const title = document.getElementById('overlay-title');

        // Reset
        infoContainer.style.display = 'none';
        photoContainer.style.display = 'none';
        sigContainer.style.display = 'none';
        infoContent.innerHTML = '';
        img.src = '';
        sigImg.src = '';

        if (type === 'ID_FRONT_IMAGE' || type === 'ID_BACK_IMAGE') {
          title.textContent = (type === 'ID_FRONT_IMAGE' ? 'Ausweis Vorderseite' : 'Ausweis Rückseite');
          img.src = `/api/v1/admin/secret/id.jpeg?id=${encodeURIComponent(id)}`;
          photoContainer.style.display = 'flex';
          document.getElementById('photo-overlay').style.display = 'flex';
        } 
        else if (type === 'ID_SIGNATURE_JWT') {
          title.textContent = 'Signatur Audit';
          
          fetch(`/api/v1/admin/secret/userinfo.json?id=${encodeURIComponent(id)}`)
            .then(r => r.json())
            .then(data => {
              let html = '<div class="mb-3"><strong>Herausgeber (Publisher):</strong><br>' + formatUserObj(data.publisher) + '</div>';
              
              if (data.customer) {
                html += '<div class="mb-3"><strong>Kunde (Customer):</strong><br>';
                let customerDetails = formatUserObj(data.customer);
                if (data.name) {
                  html += `${data.name} (${customerDetails})`;
                } else {
                  html += customerDetails;
                }
                html += '</div>';
              } else if (data.name) {
                html += '<div class="mb-3"><strong>Kunde (Customer):</strong><br>' + data.name + '</div>';
              }

              html += '<hr><div class="row small">';
              for (const [key, value] of Object.entries(data)) {
                if (key !== 'publisher' && key !== 'customer' && key !== 'name' && typeof value !== 'object') {
                  html += `<div class="col-4 text-muted">${key}:</div><div class="col-8">${value}</div>`;
                }
              }
              html += '</div>';
              
              infoContent.innerHTML = html;
              infoContainer.style.display = 'block';
              
              // Add signature image
              sigImg.src = `/api/v1/admin/secret/signature.png?id=${encodeURIComponent(id)}`;
              sigContainer.style.display = 'block';
              
              document.getElementById('photo-overlay').style.display = 'flex';
            })
            .catch(err => alert('Fehler beim Laden der Details: ' + err.message));
        }
        else if (type === 'EXT_IDENTIFICATION_STATUS') {
          title.textContent = 'Status Audit';

          const entry = currentAuditEntries.find(e => e.id === id);
          if (!entry || !entry.secret) {
            alert('Kein Status für diesen Eintrag verfügbar.');
            return;
          }

          let status;
          try {
            status = JSON.parse(entry.secret);
          } catch (e) {
            alert('Status-JSON konnte nicht gelesen werden: ' + e.message);
            return;
          }

          infoContent.innerHTML = renderIdentificationStatus(status);
          infoContainer.style.display = 'block';
          document.getElementById('photo-overlay').style.display = 'flex';
        }
        else if (type === 'EXT_IDENTIFICATION_ARCHIVE') {
          title.textContent = 'Identifikations-Archiv';

          fetch(`/api/v1/admin/secret/archive.json?id=${encodeURIComponent(id)}`)
            .then(r => {
              if (!r.ok) throw new Error(`Server-Fehler: ${r.status}`);
              return r.json();
            })
            .then(data => {
              currentArchive = { id: id, data: data };
              infoContent.innerHTML = renderArchive(data);
              infoContainer.style.display = 'block';
              document.getElementById('photo-overlay').style.display = 'flex';
            })
            .catch(err => alert('Fehler beim Laden des Archivs: ' + err.message));
        }
        else {
          alert('Details für Typ ' + type + ' (ID: ' + id + ') folgen...');
        }
      }

      commonNameInput.addEventListener('keyup', () => {
        const input = commonNameInput.value.trim();
        clearTimeout(debounceTimer);

        if (input.length < 5)
        {
          if (currentAbortController)
           
            currentAbortController.abort();
          commonNameResults.classList.add('d-none');
          commonNameResults.innerHTML = '';
          return;
        }

        debounceTimer = setTimeout(() => {
          if (currentAbortController)
           
            currentAbortController.abort();
          currentAbortController = new AbortController();

          fetchPersons(input, currentAbortController.signal)
                  .then(persons => {
                    commonNameResults.innerHTML = '';
                    if (persons && persons.length > 0)
                    {
                      persons.forEach(person => {
                        const option = document.createElement('option');
                        option.value = person.uid;
                        option.textContent = `${person.firstname}, ${person.lastname} (${person.birthday || ''})`;
                        commonNameResults.appendChild(option);
                      });
                      commonNameResults.classList.remove('d-none');
                    }
                    else
                    {
                      commonNameResults.classList.add('d-none');
                    }
                  })
                  .catch(err => {
                    if (err.name !== 'AbortError')
                     
                      console.error(err);
                  });
        }, 300);
      });

      commonNameResults.addEventListener('change', () => {
        const selectedOption = commonNameResults.options[commonNameResults.selectedIndex];
        if (selectedOption)
        {
          commonNameInput.value = selectedOption.text;
          selectedPersonUid = selectedOption.value;
          commonNameResults.classList.add('d-none');
          performAuditSearch(selectedPersonUid);
        }
      });

      btnClearCommonName.addEventListener('click', () => {
        commonNameInput.value = '';
        commonNameResults.innerHTML = '';
        commonNameResults.classList.add('d-none');
        selectedPersonUid = null;
        currentUserUid = null;
        userActions.classList.add('d-none');
        auditResultsBody.innerHTML = `
          <tr>
            <td colspan="3" class="text-center py-4 text-muted">
              <i class="fa-solid fa-search me-2"></i> Bitte suchen Sie nach einer Person.
            </td>
          </tr>`;
      });

      // Export: downloads a ZIP of the decrypted SdbSecretData metadata
      // (without publisher / binary data). Fetched as a blob so errors (e.g.
      // sealed vault → 403) are shown without navigating away from the page.
      btnExportUser.addEventListener('click', () => {
        if (!currentUserUid) return;
        btnExportUser.disabled = true;
        fetch(`/api/v1/admin/secret/export/person/${encodeURIComponent(currentUserUid)}`, {
          headers: {'Accept': 'application/zip'}
        })
          .then(r => {
            if (!r.ok) throw new Error(`Server-Fehler: ${r.status}`);
            return r.blob();
          })
          .then(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentUserUid}-metadata.zip`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
          })
          .catch(err => alert('Fehler beim Export: ' + err.message))
          .finally(() => { btnExportUser.disabled = false; });
      });

      // Delete: irreversible erasure of ALL data of the selected user.
      btnDeleteUser.addEventListener('click', () => {
        if (!currentUserUid) return;
        if (!confirm(`ACHTUNG – unwiderrufliche Löschung\n\n`
          + `Sämtliche gespeicherten Daten des Nutzers "${currentUserUid}" `
          + `(alle Datensätze und zugehörigen Dateien) werden dauerhaft gelöscht.\n\n`
          + `Fortfahren?`)) {
          return;
        }

        btnDeleteUser.disabled = true;
        const headers = {'Accept': 'application/json'};
        if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

        fetch(`/api/v1/admin/secret/person/${encodeURIComponent(currentUserUid)}/delete`, {
          method: 'POST',
          headers: headers
        })
          .then(r => {
            if (!r.ok) throw new Error(`Server-Fehler: ${r.status}`);
            return r.json();
          })
          .then(res => {
            let msg = `Löschung abgeschlossen: ${res.deletedRecords} Datensatz/Datensätze gelöscht.`;
            if (!res.complete) msg += `\n${res.failedRecords} Datensatz/Datensätze konnten NICHT gelöscht werden.`;
            alert(msg);
            performAuditSearch(currentUserUid); // refresh (should now be empty)
          })
          .catch(err => alert('Fehler beim Löschen: ' + err.message))
          .finally(() => { btnDeleteUser.disabled = false; });
      });

      function performAuditSearch(uid)
      {
        currentUserUid = uid;
        userActions.classList.add('d-none');
        auditResultsBody.innerHTML = `
          <tr>
            <td colspan="3" class="text-center py-4">
              <div class="spinner-border spinner-border-sm text-danger me-2"></div> Audit-Daten werden geladen...
            </td>
          </tr>`;

        fetchAuditData(uid)
                .then(updateAuditTable)
                .catch(err => {
                  auditResultsBody.innerHTML = `
              <tr>
                <td colspan="3" class="text-center py-4 text-danger">
                  <i class="fa-solid fa-circle-exclamation me-2"></i> Fehler: ${err.message}
                </td>
              </tr>`;
                });
      }

      btnSendCommonName.addEventListener('click', () => {
        if (selectedPersonUid)
        {
          performAuditSearch(selectedPersonUid);
        }
        else
        {
          const input = commonNameInput.value.trim();
          if (input.length < 3)
          {
            alert("Bitte geben Sie mindestens 3 Zeichen für die Suche ein.");
            return;
          }
          alert("Bitte wählen Sie zuerst eine Person aus der Liste aus.");
        }
      });
    </script>
  </body>
</html>
